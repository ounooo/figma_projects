<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление доступа — Блюимпекс</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=10">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body data-access="guest">
  <div data-include="header"></div>
  <main class="container">
    <div class="auth">
      <div class="auth__lead">
        <span class="caption">Восстановление доступа</span>
        <h1 class="h1">Вход по коду</h1>
        <p>Введите номер телефона, на который зарегистрирован личный кабинет. Мы отправим на него SMS с кодом для входа.</p>
      </div>
      <form class="form" data-form="login.html" novalidate>
        <h2 class="h3">Получить код</h2>
        <label class="field"><span class="field__label">Номер телефона<i>*</i></span>
          <input type="tel" required placeholder="+" autocomplete="tel">
          <span class="field__hint">Без маски: введите номер целиком, с кодом страны +375 или +7</span>
        </label>
        <button class="btn btn--primary btn--block" type="submit">Получить код</button>
        <p class="form__switch"><a href="login.html">Войти по паролю</a></p>
      </form>
    </div>
  </main>
  <div data-include="footer"></div>
  <script src="assets/app.js?v=10"></script>
  <script src="assets/account.js?v=10"></script>
</body>
</html>
